# Broker local para probar la red del SD81 sin internet de por medio.
# Arranque (en una terminal, sin servicio; Ctrl+C para pararlo): run_mosquitto.bat
#   "C:\Program Files\mosquitto\mosquitto.exe" -c C:\ClaudeCode\SD81-Booster\claude\mqtttest\mosquitto.conf
# SIN -v: con -v se apunta cada PUBLISH (miles por minuto) y el terminal solo guarda los ultimos minutos.
listener 1883 0.0.0.0
allow_anonymous true

# Solo las conexiones y los avisos (cuando entra, sale o se cae un cliente y por que), con la hora, en un fichero que no se pierde
log_dest stdout
log_dest file C:/ClaudeCode/SD81-Booster/claude/mqtttest/mosquitto.log
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp true
log_timestamp_format %Y-%m-%d %H:%M:%S
